# bc250-vcn-driver v0.1.0 - https://github.com/Kai/bc250-vcn-driver
# Optimized Sunshine Configuration for AMD BC-250 APU
# Place in: ~/.config/sunshine/sunshine.conf or /etc/sunshine/sunshine.conf

# Hardware Encoder Configuration
encoder = vaapi
adapter_name = /dev/dri/renderD128

# Streaming Tuning
min_threads = 2
fec_percentage = 20
channels = 2

# Low-Latency Settings
nvenc_preset = 1
hevc_mode = 0
qp = 26
audio_sink = auto
origin_pin_allowed = 2
back_button_timeout = 2000
