name: Build & Release BC-250 Drivers

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libva-dev \
          libdrm-dev \
          libvulkan-dev \
          glslang-tools \
          libva-utils

    - name: Configure CMake
      run: |
        cmake -B approach1-compute-encoder/build \
              -S approach1-compute-encoder \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTS=ON

    - name: Build Driver & Compile Shaders
      run: |
        cmake --build approach1-compute-encoder/build --parallel $(nproc)

    - name: Run Test Suite
      run: |
        ctest --test-dir approach1-compute-encoder/build --output-on-failure

    - name: Package Release Bundle
      run: |
        mkdir -p dist/bc250-driver/shaders
        cp approach1-compute-encoder/build/bc250_drv_video.so dist/bc250-driver/
        cp approach1-compute-encoder/build/*.spv dist/bc250-driver/shaders/ 2>/dev/null || true
        cp build_and_install.sh dist/bc250-driver/
        cp -r tools dist/bc250-driver/
        cp -r audio-fix dist/bc250-driver/
        cp README.md dist/bc250-driver/
        cp LICENSE dist/bc250-driver/
        
        cd dist
        tar -czvf ../bc250-driver-linux-x86_64.tar.gz bc250-driver/
        cd ..

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bc250-driver-linux-x86_64
        path: bc250-driver-linux-x86_64.tar.gz

    - name: Publish GitHub Release (Tags only)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: bc250-driver-linux-x86_64.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
